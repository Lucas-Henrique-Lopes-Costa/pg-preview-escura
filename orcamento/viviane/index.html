  <meta property="og:description" content="Acesso exclusivo. Digite sua senha para abrir." />

    rel="stylesheet" />
  <style>
    :root {
      --espresso: #0c0704;
      --bloco: #160d07;
      --bloco-claro: #1f140c;
      --linha: rgba(246, 185, 74, 0.18);
      --linha-suave: rgba(255, 255, 255, 0.08);
      --creme: #f5ede0;
      --creme-suave: #c9b8a4;
      --creme-fraco: #9a866c;
      --ouro: #f6b94a;
      --verde: #25d366;
      --verde-escuro: #1fb857;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--espresso);
      color: var(--creme);
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.65;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    b, strong { font-weight: 600; color: #fff; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    section { padding: 64px 0; }
    .bloco { background: var(--bloco); }

    .rotulo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ouro);
      margin: 0 0 14px;
    }
    h1, h2, h3 { font-weight: 300; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
    h1 { font-size: 36px; }
    h2 { font-size: 28px; margin-bottom: 18px; }
    h3 { font-size: 19px; font-weight: 500; margin-bottom: 8px; }
    em { font-style: normal; color: var(--ouro); }
    .lead { font-size: 17px; color: var(--creme-suave); max-width: 680px; margin: 18px 0 0; }
    p { margin: 0 0 12px; }

    .btn {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 500;
      padding: 17px 28px;
      border-radius: 6px;
      border: 0;
      background: var(--verde);
      color: #1a1006;
      cursor: pointer;
      text-align: center;
      transition: background-color .2s;
    }
    .btn:hover { background: var(--verde-escuro); }
    .btn-bloco { display: block; width: 100%; }

    /* ── Portão ─────────────────────────────────────────────── */
    .portao {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(12, 7, 4, .78), rgba(12, 7, 4, .96)),
        url('/pg-preview-escura/assets/fotos/Paseo_La_Galeria_at_dusk.jpg') center/cover;
    }
    .portao form {
      width: 100%;
      max-width: 400px;
      background: rgba(22, 13, 7, .92);
      border: 1px solid var(--linha);
      border-radius: 14px;
      padding: 36px 28px;
      text-align: center;
    }
    .portao img { width: 64px; margin: 0 auto 18px; }
    .portao h1 { font-size: 24px; margin-bottom: 8px; }
    .portao p { color: var(--creme-suave); font-size: 14px; }
    .portao input {
      width: 100%;
      margin: 18px 0 12px;
      padding: 15px 16px;
      font: inherit;
      font-size: 16px;
      color: var(--creme);
      background: var(--espresso);
      border: 1px solid var(--linha);
      border-radius: 6px;
      outline: none;
      text-align: center;
    }
    .portao input:focus { border-color: var(--ouro); }
    .portao .erro { color: #ff8a7a; font-size: 13px; min-height: 20px; margin: 10px 0 0; }

    /* ── Conteúdo ───────────────────────────────────────────── */
    .topo {
      padding: 18px 0;
      border-bottom: 1px solid var(--linha-suave);
    }
    .topo .wrap { display: flex; align-items: center; justify-content: space-between; }
    .topo img { height: 38px; }
    .topo span { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--creme-fraco); }

    .hero {
      padding: 80px 0 72px;
      background:
        linear-gradient(180deg, rgba(12, 7, 4, .55), var(--espresso)),
        url('/pg-preview-escura/assets/fotos/asuncion-aerea.png') center/cover;
    }
    .hero .valor-chave {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 20px;
      border: 1px solid var(--linha);
      border-radius: 10px;
      background: rgba(12, 7, 4, .7);
      font-size: 14px;
      color: var(--creme-suave);
    }
    .hero .valor-chave b { color: var(--ouro); font-size: 20px; font-weight: 500; }

    .grade { display: flex; flex-wrap: wrap; margin: 28px -8px 0; }
    .grade > div { width: 100%; padding: 8px; }
    .cartao {
      height: 100%;
      background: var(--bloco-claro);
      border: 1px solid var(--linha-suave);
      border-radius: 12px;
      padding: 24px;
    }
    .cartao p { color: var(--creme-suave); font-size: 15px; margin: 0; }
    .cartao .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ouro);
      letter-spacing: .14em;
      margin-bottom: 10px;
      display: block;
    }

    .lista { list-style: none; padding: 0; margin: 14px 0 0; }
    .lista li { position: relative; padding-left: 26px; margin-bottom: 9px; color: var(--creme-suave); font-size: 15px; }
    .lista li::before { content: '✓'; position: absolute; left: 0; color: var(--verde); font-weight: 700; }

    .pessoa {
      border: 1px solid var(--linha);
      border-radius: 12px;
      padding: 26px 24px;
      background: var(--bloco-claro);
      height: 100%;
    }
    .pessoa .preco { font-size: 26px; color: var(--ouro); font-weight: 400; margin-top: 16px; }
    .pessoa .tipo { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--creme-fraco); }

    .etapas { counter-reset: e; margin-top: 28px; }
    .etapa { position: relative; padding: 0 0 26px 52px; border-left: 1px solid var(--linha); margin-left: 16px; }
    .etapa:last-child { border-left-color: transparent; padding-bottom: 0; }
    .etapa::before {
      counter-increment: e;
      content: counter(e);
      position: absolute;
      left: -17px;
      top: -4px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--ouro);
      color: #1a1006;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .etapa p { color: var(--creme-suave); font-size: 15px; margin: 0; }

    .investimento {
      border: 1px solid var(--ouro);
      border-radius: 16px;
      padding: 32px 24px;
      background: var(--bloco-claro);
    }
    .linha-inv {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid var(--linha-suave);
      font-size: 15px;
      color: var(--creme-suave);
    }
    .linha-inv span:last-child { color: var(--creme); white-space: nowrap; padding-left: 12px; }
    .total { margin-top: 24px; text-align: center; }
    .total .usd { font-size: 46px; color: var(--ouro); font-weight: 400; line-height: 1.1; }
    .total .brl { font-size: 17px; color: var(--creme-suave); margin-top: 6px; }
    .parcela {
      margin: 22px 0 26px;
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      background: rgba(37, 211, 102, .1);
      border: 1px solid rgba(37, 211, 102, .35);
      font-size: 16px;
    }
    .parcela b { color: var(--verde); }

    .faq details {
      border-bottom: 1px solid var(--linha-suave);
      padding: 18px 0;
    }
    .faq summary {
      cursor: pointer;
      font-size: 17px;
      font-weight: 400;
      list-style: none;
      position: relative;
      padding-right: 30px;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary::after { content: '+'; position: absolute; right: 0; top: -2px; color: var(--ouro); font-size: 22px; }
    .faq details[open] summary::after { content: '–'; }
    .faq details p { color: var(--creme-suave); font-size: 15px; margin: 12px 0 0; }

    .comparar { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 14px; }
    .comparar th, .comparar td { padding: 13px 10px; border-bottom: 1px solid var(--linha-suave); text-align: left; vertical-align: top; }
    .comparar th { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--creme-fraco); font-weight: 400; }
    .comparar td:first-child { color: var(--creme-suave); }
    .comparar .bom { color: var(--verde); }
    .comparar .ruim { color: #ff8a7a; }

    .final { text-align: center; }
    .final .lead { margin-left: auto; margin-right: auto; }
    .final .btn { margin-top: 30px; }
    .rodape { padding: 30px 0 90px; text-align: center; font-size: 12px; color: var(--creme-fraco); }

    .zap-fixo {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 60px;
      height: 60px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }

    .zap-fixo svg { width: 32px; height: 32px; }

    @media (min-width: 720px) {
      h1 { font-size: 50px; }
      h2 { font-size: 36px; }
      section { padding: 88px 0; }
      .grade > div { width: 50%; }
      .grade.tres > div { width: 33.3333%; }
      .investimento { padding: 44px 48px; }
      .total .usd { font-size: 60px; }
      .zap-fixo { right: 24px; bottom: 24px; }
    }

    /* ── Entrada (mesma animação da Academy Rafão) ─────────── */
    .intro{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--espresso);pointer-events:none;animation:introSai .78s cubic-bezier(.7,0,.3,1) 2.3s forwards}
    .intro__linha{position:relative;line-height:1.1;font-size:34px;letter-spacing:-.04em;font-weight:400;white-space:nowrap}
    .intro__nome{display:inline-block;overflow:hidden;clip-path:inset(0 100% 0 0);animation:introEscreve .9s cubic-bezier(.22,.61,.36,1) .25s forwards}
    .intro__pt{color:#5e4a33;animation:introPonto .45s ease .95s forwards}
    .intro__risco{position:absolute;left:0;right:0;bottom:-.3em;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ouro) 30%,var(--ouro) 70%,transparent);transform:scaleX(0);transform-origin:left;animation:introRisco .7s cubic-bezier(.16,1,.3,1) 1.45s forwards}
    @keyframes introEscreve{to{clip-path:inset(0 0 0 0)}}
    @keyframes introPonto{to{color:var(--ouro)}}
    @keyframes introRisco{40%{transform:scaleX(1);transform-origin:left}41%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
    @keyframes introSai{to{transform:translateY(-101%);visibility:hidden}}
    @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
    .hero .wrap>*{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
    .com-intro .hero .wrap>*{animation-delay:2.65s}
    .hero .wrap>*:nth-child(2){animation-delay:.1s}.com-intro .hero .wrap>*:nth-child(2){animation-delay:2.75s}
    .hero .wrap>*:nth-child(3){animation-delay:.2s}.com-intro .hero .wrap>*:nth-child(3){animation-delay:2.85s}
    .hero .wrap>*:nth-child(4){animation-delay:.3s}.com-intro .hero .wrap>*:nth-child(4){animation-delay:2.95s}
    .sobe{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}
    .sobe.visto{opacity:1;transform:none}
    @media (prefers-reduced-motion: reduce){.intro{display:none}.hero .wrap>*,.sobe{animation:none!important;opacity:1;transform:none;transition:none}}
    @media (min-width: 720px){.intro__linha{font-size:60px}}
  </style>
</head>

<body>
  <div class="portao" id="portao">
    <form id="form-portao" autocomplete="off">
      <img src="/pg-preview-escura/assets/logo-sem-fundo.png" alt="Paraguai Global Group" />
      <h1>Sua proposta está pronta</h1>
      <p>Este é um acesso exclusivo. Para abrir, digite sua senha.</p>
      <input id="senha" type="password" placeholder="Senha" autocapitalize="none" required />
      <button class="btn btn-bloco" type="submit">Ver minha proposta</button>
      <p class="erro" id="erro" role="alert"></p>
    </form>
  </div>
  <div id="conteudo" hidden></div>

      var form = document.getElementById('form-portao');
      var erro = document.getElementById('erro');
      var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
      var normaliza = function (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase(); };

      function abrir(senha) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey('raw', enc.encode(normaliza(senha)), 'PBKDF2', false, ['deriveKey'])
          .then(function (base) {
            return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(PACOTE.s), iterations: 250000, hash: 'SHA-256' },
              base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
          })
          .then(function (chave) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PACOTE.i) }, chave, bytes(PACOTE.c)); })
          .then(function (html) {
            var alvo = document.getElementById('conteudo');
            alvo.innerHTML = new TextDecoder().decode(html);
            alvo.hidden = false;
            if (alvo.querySelector('.intro')) document.documentElement.classList.add('com-intro');
            var itens = alvo.querySelectorAll('section:not(.hero) .wrap > *, .grade > div, .etapa, .faq details');
            if ('IntersectionObserver' in window) {
              var obs = new IntersectionObserver(function (es) {
                es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visto'); obs.unobserve(e.target); } });
              }, { rootMargin: '0px 0px -8% 0px' });
              Array.prototype.forEach.call(itens, function (el) { el.classList.add('sobe'); obs.observe(el); });
            }
            document.getElementById('portao').remove();
            try { sessionStorage.setItem('orc:' + location.pathname, senha); } catch (e) { }
            window.scrollTo(0, 0);
          });
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var botao = form.querySelector('button');
        botao.disabled = true;
        botao.textContent = 'Abrindo...';
        erro.textContent = '';
        abrir(document.getElementById('senha').value).catch(function () {
          erro.textContent = 'Senha incorreta. Tente novamente.';
          botao.disabled = false;
          botao.textContent = 'Ver minha proposta';
        });
      });

      var salva = null;
      try { salva = sessionStorage.getItem('orc:' + location.pathname); } catch (e) { }
      if (salva) abrir(salva).catch(function () { });
    })();
  </script>
