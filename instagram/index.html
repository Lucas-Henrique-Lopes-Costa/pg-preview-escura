<body>
  <main>
    <form id="lead" class="caixa" novalidate data-canal="Instagram (@paraguaicapitalbr)"
      data-destino="https://www.instagram.com/paraguaicapitalbr/">
      <img class="logo" src="../assets/logo-sem-fundo.png" alt="Paraguai Global Group">
      <span class="kick">Instagram</span>
      <h1>Falta só um passo</h1>
      <p class="sub">Deixe seu nome e WhatsApp e siga a gente no Instagram.</p>

      <label for="nome">Seu nome</label>
      <input id="nome" name="nome" autocomplete="name" placeholder="Nome e sobrenome">
      <div class="erro" data-erro="nome">Escreva seu nome completo.</div>

      <label for="telefone">WhatsApp com DDD</label>
      <input id="telefone" name="telefone" type="tel" autocomplete="tel-national" inputmode="numeric"
        placeholder="(11) 99999-9999">
      <div class="erro" data-erro="telefone">Informe um WhatsApp válido com DDD.</div>

      <button type="submit">Ir para o Instagram</button>
      <p class="nota">Seus dados não são compartilhados com terceiros.</p>
    </form>
  </main>
  <script src="../assets/link-gate.js"></script>
</body>
